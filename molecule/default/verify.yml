---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    base: https://127.0.0.1/phpmyadmin/
  tasks:
    - name: Plain HTTP redirects to HTTPS
      ansible.builtin.uri:
        url: http://127.0.0.1/phpmyadmin/
        follow_redirects: none
        status_code: 301

    - name: Load the login page
      ansible.builtin.uri:
        url: "{{ base }}"
        validate_certs: false
        return_content: true
      register: login_page

    - name: Assert the login form is served
      ansible.builtin.assert:
        that:
          - "'pma_username' in login_page.content"
          - login_page.x_powered_by is not defined

    # phpMyAdmin sets its auth cookie on failed logins too, so a wrong password
    # goes first to prove the check can tell them apart. One miss stays under the
    # MariaDB role's lockout, and the good login resets the count.
    - name: Log in with a wrong password, then the right one
      ansible.builtin.include_tasks: tasks/login.yml
      loop:
        - { jar: /tmp/pma-wrong.jar, password: not-the-password, post_status: "200", form_back: true }
        - { jar: /tmp/pma-right.jar, password: Molecule-Passw0rd!Pma, post_status: "302", form_back: false }
      loop_control:
        loop_var: attempt
        label: "{{ attempt.jar }}"

    - name: Setup and library directories are refused
      ansible.builtin.uri:
        url: "{{ base }}{{ item }}"
        validate_certs: false
        status_code: 403
      loop: [setup/, libraries/, vendor/]

    - name: Read the fapolicyd files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/fapolicyd/trust.d/phpmyadmin
        - /etc/fapolicyd/rules.d/65-phpmyadmin.rules
      register: fapolicyd

    - name: Assert config.inc.php is trusted and the temp rule exists
      ansible.builtin.assert:
        that:
          - "'/etc/phpMyAdmin/config.inc.php ' in (fapolicyd.results[0].content | b64decode)"
          - "'dir=/var/lib/phpMyAdmin/temp/' in (fapolicyd.results[1].content | b64decode)"
