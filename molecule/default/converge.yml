---
- name: Converge
  hosts: all
  vars:
    mariadb_users:
      - name: pmatest
        host: localhost
        password: Molecule-Passw0rd!Pma
        priv: "*.*:SELECT"
    apache_php_enabled: true
    apache_php_packages: [php-mysqlnd]
  tasks:
    - name: Include the MariaDB role
      ansible.builtin.include_role:
        name: ansible-role-mariadb

    - name: Include the Apache role
      ansible.builtin.include_role:
        name: ansible-role-apache

    - name: Include the phpMyAdmin role
      ansible.builtin.include_role:
        name: ansible-role-phpmyadmin
