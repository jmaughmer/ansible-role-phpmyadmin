---
# config.yml generates the blowfish secret with openssl, which minimal installs lack.
- name: Install phpMyAdmin
  ansible.builtin.dnf:
    name: "{{ phpmyadmin_packages + ([] if phpmyadmin_blowfish_secret | length > 0 else ['openssl']) }}"
    state: present

- name: Gather package facts
  ansible.builtin.package_facts:

- name: Assert Apache and PHP-FPM are installed
  ansible.builtin.assert:
    that:
      - "'httpd' in ansible_facts.packages"
      - "'mod_ssl' in ansible_facts.packages"
      - "'php-fpm' in ansible_facts.packages"
    fail_msg: >-
      phpMyAdmin needs Apache with mod_ssl and PHP-FPM. Run ansible-role-apache
      with apache_php_enabled: true before this role.
    quiet: true
  when: not ansible_check_mode

# php-fpm runs as apache and has to enter the directory holding a local socket.
- name: Check apache can reach the local database sockets
  ansible.builtin.command:
    argv: [/usr/sbin/runuser, -u, apache, --, test, -x, "{{ item | dirname }}"]
  loop: "{{ phpmyadmin_servers | selectattr('socket', 'defined') | map(attribute='socket') | unique }}"
  register: __phpmyadmin_socket_access
  changed_when: false
  failed_when: false
  check_mode: false

- name: Assert apache can reach the local database sockets
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: >-
      php-fpm runs as apache, which cannot enter {{ item.item | dirname }}, so logging in
      to phpMyAdmin would fail with "Permission denied" on {{ item.item }}. With
      ansible-role-mariadb, set mariadb_datadir_mode: "0751".
    quiet: true
  loop: "{{ __phpmyadmin_socket_access.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode
